<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Treasure Hunt Lobby</title>
  <link rel="stylesheet" href="team.css?v=3" />
</head>
<body>

<div class="card">

  <h2>Lobby</h2>

  <div class="room-info">
    <span>JOIN CODE <b>AX-402</b></span>
    <span id="playerCount">0/∞</span>
  </div>

  <!-- CREATE TEAM -->
  <div class="create-team">
    <input type="text" id="teamNameInput" placeholder="Enter team name" />
    <button id="createTeamBtn">+ Create</button>
  </div>

  <!-- TEAM LIST -->
  <div id="teamList"></div>

  <!-- START GAME BUTTON -->
  <div class="start-section">
    <button id="startGameBtn">Start Game</button>
  </div>

</div>

<script src="team.js"></script>
</body>
</html>
