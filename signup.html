<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sign Up – Treasure Hunt</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="login">
    <div class="logo">
        <img src="treasure2.png" alt="Treasure Hunt">
    </div>

    <div class="login-content">
        <h1>Join The Quest</h1>
        <p>Create your account to start tracking clues.</p>
    </div>

    <form id="signupForm">
        <div class="input-box">
            <input id="username" type="text" placeholder="Username" required autocomplete="username">
        </div>
        <div class="input-box">
            <input id="password" type="password" placeholder="Password" required autocomplete="new-password">
        </div>
        <div class="input-box">
            <input id="confirm" type="password" placeholder="Confirm Password" required autocomplete="new-password">
        </div>
        <button class="signin-btn" type="submit">Create Account</button>
    </form>

    <div id="msg"></div>

    <div class="form-footer">
        Already a member? <a href="index.php" class="signup-link">Sign in here</a>
    </div>
</div>

<script>
document.getElementById("signupForm").onsubmit = async (e) => {
    e.preventDefault();
    const msgEl   = document.getElementById("msg");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirm  = document.getElementById("confirm").value.trim();

    if (password !== confirm) {
        msgEl.textContent = "Passwords do not match";
        msgEl.className = "error";
        return;
    }

    msgEl.textContent = "";
    msgEl.className = "";

    const res  = await fetch("api/register.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&confirmPassword=${encodeURIComponent(confirm)}`
    });
    const data = await res.json();

    if (data.success) {
        msgEl.textContent = "✔ Account created! Redirecting…";
        msgEl.className = "success";
        setTimeout(() => window.location = "index.php", 1500);
    } else {
        msgEl.textContent = data.error;
        msgEl.className = "error";
    }
};
</script>

</body>
</html>
