<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Room Progression – Treasure Hunt</title>
  <link rel="stylesheet" href="progression.css">
</head>
<body>

  <div class="page">

    <!-- HEADER -->
    <div class="header">
      <a href="admin_room.php" class="back-btn">← Back</a>
      <div class="header-center">
        <div class="header-title" id="roomTitle">Loading…</div>
        <div class="header-sub">Live Progression</div>
      </div>
      <div class="refresh-wrap">
        <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
        <span class="auto-label">Auto <span id="countdown">10</span>s</span>
      </div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-box">
        <span class="stat-num" id="statTotal">–</span>
        <span class="stat-label">Teams</span>
      </div>
      <div class="stat-box active">
        <span class="stat-num" id="statActive">–</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat-box finished">
        <span class="stat-num" id="statFinished">–</span>
        <span class="stat-label">Finished</span>
      </div>
      <div class="stat-box waiting">
        <span class="stat-num" id="statWaiting">–</span>
        <span class="stat-label">Waiting</span>
      </div>
      <div class="stat-box avg">
        <span class="stat-num" id="statAvg">–</span>
        <span class="stat-label">Avg</span>
      </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="section-title">Leaderboard</div>
    <div id="leaderboard"></div>

    <!-- CLUE GRID -->
    <div class="section-title" style="margin-top:28px">Clue Completion Matrix</div>
    <div id="matrixWrap" class="matrix-wrap">
      <div class="loading-msg">Loading…</div>
    </div>

  </div>

  <script src="progression.js"></script>
</body>
</html>
